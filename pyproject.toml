[project]
name = "fde-ask-your-data"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["warehouse/out"]

[tool.pytest.ini_options]
markers = [
  "db: needs the compose Postgres running and loaded (python -m warehouse.load)",
  "llm: needs a live LLM",
]
