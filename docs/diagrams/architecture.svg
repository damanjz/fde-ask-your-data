<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 986" width="1600" height="986" role="img" aria-label="How a question becomes checked SQL and a grounded answer"><title>How a question becomes checked SQL and a grounded answer</title><defs><marker id="dk-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="986" rx="28" fill="#e9e9e7" data-id="canvas"/><text x="64.0" y="84.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="15" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="2" data-box="canvas">FDE PORTFOLIO · 04</text><text x="64.0" y="128.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">How a question becomes checked SQL and a grounded answer</text><rect x="64.0" y="365.0" width="218.9" height="262.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="asker"/><text x="86.0" y="401.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="asker">CHANNELS</text><text x="86.0" y="439.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="asker">Ops and</text><text x="86.0" y="469.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="asker">marketing leads</text><text x="86.0" y="503.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="asker">Local page or POST</text><text x="86.0" y="527.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="asker">/ask</text><text x="86.0" y="551.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="asker">English or light Hinglish</text><text x="86.0" y="575.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="asker">Each question stands</text><text x="86.0" y="599.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="asker">alone</text><rect x="338.9" y="229.0" width="218.9" height="238.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="screen"/><text x="360.9" y="265.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="screen">GUARD IN</text><text x="360.9" y="303.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="screen">Question</text><text x="360.9" y="333.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="screen">screen</text><text x="360.9" y="367.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="screen">Blatant write or</text><text x="360.9" y="391.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="screen">personal-data requests</text><text x="360.9" y="415.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="screen">declined before any</text><text x="360.9" y="439.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="screen">model call</text><rect x="338.9" y="501.0" width="218.9" height="262.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="prompt"/><text x="360.9" y="537.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="prompt">CONTEXT</text><text x="360.9" y="575.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="prompt">Schema docs</text><text x="360.9" y="605.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="prompt">prompt</text><text x="360.9" y="639.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="prompt">Every table and column</text><text x="360.9" y="663.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="prompt">with meaning and units</text><text x="360.9" y="687.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="prompt">Time-word</text><text x="360.9" y="711.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="prompt">conventions, sample</text><text x="360.9" y="735.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="prompt">values, three examples</text><rect x="613.9" y="235.0" width="372.2" height="522.0" rx="16" fill="#fe6608" stroke="none" stroke-width="1.5" data-id="core"/><text x="635.9" y="271.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="1.5" data-box="core">AGENT LOOP</text><text x="635.9" y="313.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">fusion27b:iq3 via Ollama</text><text x="635.9" y="341.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">Local, 8k context, INR 0 per query</text><rect x="635.9" y="361.0" width="328.2" height="178.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5" data-id="sql"/><text x="657.9" y="405.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="sql">Write SQL</text><text x="657.9" y="439.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="sql">PLAN line plus one sql block, or</text><text x="657.9" y="463.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="sql">REFUSE or UNANSWERABLE</text><text x="657.9" y="487.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="sql">One correction round on a parser or</text><text x="657.9" y="511.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="sql">database error</text><rect x="635.9" y="557.0" width="328.2" height="178.0" rx="16" fill="#141414" stroke="none" stroke-width="1.5" data-id="parser"/><text x="657.9" y="601.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#e9e9e7" text-anchor="start" letter-spacing="0.0" data-box="parser">Check SQL</text><text x="657.9" y="635.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="parser">Real lexer, one SELECT or WITH</text><text x="657.9" y="659.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="parser">statement</text><text x="657.9" y="683.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="parser">Table and function allowlist, LIMIT</text><text x="657.9" y="707.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="parser">200 added</text><rect x="1042.1" y="365.0" width="218.9" height="262.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="run"/><text x="1064.1" y="401.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="run">DATABASE ROLE</text><text x="1064.1" y="439.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="run">Run read-only</text><text x="1064.1" y="473.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="run">analyst_ro, no privilege</text><text x="1064.1" y="497.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="run">on dim_customer</text><text x="1064.1" y="521.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="run">READ ONLY</text><text x="1064.1" y="545.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="run">transaction, 5 s timeout,</text><text x="1064.1" y="569.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="run">201 rows at most</text><rect x="1317.1" y="196.0" width="218.9" height="262.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="verify"/><text x="1339.1" y="232.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="verify">GUARD OUT</text><text x="1339.1" y="270.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="verify">Check the</text><text x="1339.1" y="300.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="verify">summary</text><text x="1339.1" y="334.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="verify">Every number must</text><text x="1339.1" y="358.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="verify">appear in the rows</text><text x="1339.1" y="382.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="verify">Lowest or highest</text><text x="1339.1" y="406.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="verify">claims must name the</text><text x="1339.1" y="430.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="verify">right row</text><rect x="1317.1" y="492.0" width="218.9" height="304.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="answer"/><text x="1339.1" y="528.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="answer">OUTPUT</text><text x="1339.1" y="566.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="answer">Answer</text><text x="1339.1" y="600.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="answer">The SQL, up to 50 rows,</text><text x="1339.1" y="624.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="answer">a 1-2 sentence</text><text x="1339.1" y="648.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="answer">summary</text><text x="1339.1" y="672.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="answer">A failed summary is</text><text x="1339.1" y="696.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="answer">dropped; the rows stay</text><text x="1339.1" y="720.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="answer">Request logged with</text><text x="1339.1" y="744.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="answer">emails and phones</text><text x="1339.1" y="768.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="answer">masked</text><rect x="64.0" y="846.0" width="1472.0" height="76.0" rx="16" fill="#dcdad5" stroke="none" stroke-width="1.5" data-id="band"/><text x="88.0" y="892.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="band">Postgres 17, simulated Larkfield warehouse</text><text x="558.1" y="892.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="band">8,034 orders · 13,596 order lines · 564 returns · 1,456 tickets · customers via a PII-free view</text><text x="1512.0" y="892.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="end" letter-spacing="0.0" data-box="band">Gold set: 36/40</text><path d="M286.9 416.0 L332.9 416.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M561.9 351.0 L607.9 351.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M561.9 629.0 L607.9 629.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M990.1 496.0 L1036.1 496.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1265.1 411.5 L1311.1 411.5" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1426.5 462.0 L1426.5 486.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1151.6 631.0 L1151.6 840.0" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/></svg>